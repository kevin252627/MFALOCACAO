<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Prancheta de contagem de estoque">
 <defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#62c1ff"/><stop offset=".42" stop-color="#0874ef"/><stop offset="1" stop-color="#063d9e"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff3a0"/><stop offset=".48" stop-color="#ffd02f"/><stop offset="1" stop-color="#d98100"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="145%" height="155%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".42"/></filter>
 </defs>
 <g filter="url(#shadow)" stroke-linejoin="round">
  <!-- clipboard frame -->
  <path d="M34 22h60q9 0 9 10v82q0 9-9 9H34q-9 0-9-9V32q0-10 9-10z" fill="url(#blue)" stroke="#68baff" stroke-width="2"/>
  <path d="M36 31h56v78H36z" fill="#f8fbff" stroke="#c7d6e8" stroke-width="2"/>
  <!-- gold clip -->
  <path d="M48 18q0-9 9-9h14q9 0 9 9v12H48z" fill="url(#gold)" stroke="#fff0a1" stroke-width="2"/>
  <circle cx="64" cy="17" r="4" fill="#9a5a00" stroke="#ffe791" stroke-width="2"/>
  <!-- MF mark -->
  <path d="M45 47l3-16h5l4 8 4-8h5l3 16h-5l-1-9-5 7-4-7-2 9zM69 31h14v4h-9v3h8v4h-8v5h-5z" fill="#08295d"/>
  <path d="M44 53h41" stroke="url(#blue)" stroke-width="2.5"/>
  <!-- counted inventory rows -->
  <g fill="none" stroke="#24599e" stroke-width="2.5" stroke-linecap="round">
   <path d="M55 66h23M55 82h23M55 98h23"/>
  </g>
  <g fill="url(#blue)" stroke="#9acfff" stroke-width="1.5">
   <path d="M43 63h7v7h-7zM43 79h7v7h-7zM43 95h7v7h-7z"/>
  </g>
  <!-- golden check marks -->
  <g fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
   <path d="M82 67l3 3 7-8M82 83l3 3 7-8M82 99l3 3 7-8"/>
  </g>
  <!-- pencil -->
  <g transform="rotate(34 104 81)">
   <path d="M101 55h8v45h-8z" fill="url(#blue)" stroke="#9cd7ff" stroke-width="1.5"/>
   <path d="M101 55h8v8h-8z" fill="url(#gold)" stroke="#ffefa3" stroke-width="1"/>
   <path d="M101 100h8l-4 10z" fill="#f1c887" stroke="#d99d42" stroke-width="1"/>
   <path d="M103 106l2 4 2-4" fill="#183b70"/>
  </g>
 </g>
</svg>
